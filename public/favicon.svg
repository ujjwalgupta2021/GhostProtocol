<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect width="62" height="62" x="1" y="1" rx="15" stroke="url(#shieldGrad)" stroke-width="2" stroke-opacity="0.7" />
  
  <!-- Cyber Security Shield -->
  <path d="M32 10L48 16V30C48 40.5 41.2 50.1 32 54C22.8 50.1 16 40.5 16 30V16L32 10Z" fill="url(#shieldGrad)" fill-opacity="0.25" stroke="url(#shieldGrad)" stroke-width="3" stroke-linejoin="round" />
  
  <!-- Ghost Eyes / Digital Nodes inside Shield -->
  <circle cx="27" cy="27" r="3" fill="#22d3ee" filter="url(#glow)" />
  <circle cx="37" cy="27" r="3" fill="#22d3ee" filter="url(#glow)" />
  
  <!-- Protective Checkmark Crest -->
  <path d="M25 36L30 41L39 31" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
